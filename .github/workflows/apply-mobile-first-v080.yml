name: Apply mobile-first v0.8.0

on:
  push:
    branches: [design/mobile-first-v0.8.0]
    paths:
      - scripts/apply-mobile-home-v080.mjs
      - .github/workflows/apply-mobile-first-v080.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/mobile-first-v0.8.0
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply mobile Home redesign
        run: node scripts/apply-mobile-home-v080.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Commit verified redesign
        run: |
          git config user.name "SCIM release automation"
          git config user.email "actions@users.noreply.github.com"
          git add components/home-dashboard.tsx
          git commit -m "Redesign Home for mobile-first use"
          git push origin HEAD:design/mobile-first-v0.8.0
