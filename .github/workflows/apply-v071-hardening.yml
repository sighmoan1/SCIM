name: Apply v0.7.1 hardening

on:
  push:
    branches: [hardening/v0.7.1]
    paths:
      - scripts/apply-v071-hardening.mjs
      - .github/workflows/apply-v071-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.7.1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source changes
        run: node scripts/apply-v071-hardening.mjs
      - name: Refresh lockfile and install
        run: pnpm install --no-frozen-lockfile
      - name: Verify hardening release
        run: pnpm verify
      - name: Remove one-time migration
        run: rm scripts/apply-v071-hardening.mjs .github/workflows/apply-v071-hardening.yml
      - name: Commit verified release
        run: |
          git config user.name "SCIM release automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Harden SCIM v0.7.1"
          git push origin HEAD:hardening/v0.7.1
