name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v0.7.1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update README decisions
        run: node scripts/update-readme-v071.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Commit verified README update
        run: |
          git config user.name "SCIM release automation"
          git config user.email "actions@users.noreply.github.com"
          git add README.md
          git commit -m "Document current SCIM product decisions"
          git push origin HEAD:hardening/v0.7.1
